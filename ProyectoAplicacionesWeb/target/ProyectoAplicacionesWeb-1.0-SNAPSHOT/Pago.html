<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago en linea</title>
    <link rel="stylesheet" href="estilosCSS/estiloPago.css">
</head>

<body>
    <div class="background-blur"></div>
    <div class="login-container">
        <h1>Pago con tarjeta</h1>

        <form action="pantallaCarga.jsp" method="POST">

            <div class="form-group">
                <label>Numero de 16 digitos</label>
                <input type="text" name="txtNumero" maxlength="16" pattern="[0-9]{16}"
                    title="Debe ser un número de 16 dígitos" required>
            </div>

            <div class="form-group">
                <label>NIP</label>
                <input type="password" name="txtNIP" maxlength="4" pattern="[0-9]{3,4}" required>
            </div>

            <button type="submit" class="btn">Realizar Pago</button>
        </form>
    </div>
</body>

</html>
