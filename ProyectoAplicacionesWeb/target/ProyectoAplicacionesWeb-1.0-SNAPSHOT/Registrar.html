<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Registrarse</title>
    <link rel="stylesheet" type="text/css" href="./estilosCSS/estiloUsuario.css">
</head>
<body>
    <div class="background-blur"></div>

    <div class="login-container">
        <h1>Registro</h1>

        <form action="ControladorUsuario" method="POST">
    <input type="hidden" name="accion" value="registrarCliente">
    <input type="hidden" name="txtRol" value="cliente">

    <div class="form-group">
        <label>Nombre Completo</label>
        <input type="text" name="txtNombreCompleto" required>
    </div>

    <div class="form-group">
        <label>Nombre de Usuario</label>
        <input type="text" name="txtUsuario" required>
    </div>

    <div class="form-group">
        <label>Dirección</label>
        <input type="text" name="txtDireccion" required>
    </div>

    <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" name="txtCorreo" required>
    </div>

    <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="txtPassword">
    </div>

    <button type="submit">Crear Cuenta</button>
</form>

    </div>

</body>
</html>
