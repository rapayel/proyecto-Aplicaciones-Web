<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>recuperar Cuenta</title>
    <link rel="stylesheet" type="text/css" href="./estilosCSS/estiloUsuario.css">
</head>
<body>
    <div class="background-blur"></div>
    <div class="login-container">
        <h1>Recuperar</h1>
        <form action="ControladorUsuario" method="POST">
        <input type="hidden" name="accion" value="recuperarCuenta">
            <div class="form-group">
                <label for="usuario">Nombre de Usuario</label>
                <input type="text" id="usuario" name="txtUsuario" placeholder="Ingresa tu usario para recuperar tu cuenta" 
                pattern="[a-zA-Z0-9._%+-]+" required>
            </div>
        <p>le enviamos su contraseña a su correo electronico, verifique si lo recibio</p>
            <button type="submit" class="btn">Entrar</button>
        </form>
        <div class="links-adicionales">
            <a href="InicioSesion.html">regresar a la pestaña anterioe</a>
        </div>
    </div>
</body>
</html>
