<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" type="text/css" href="./estilosCSS/estiloIniciarSesion.css">
</head>
<body>
    <div class="background-blur"></div>
    <div class="login-container">
        <h1>Iniciar Sesión</h1>
        <form action="ControladorTienda" method="POST">
        <input type="hidden" name="accion" value="validarLogin">
            <div class="form-group">
                <label for="email">Usuario</label>
                <input type="text" id="email" name="txtEmail" placeholder="Ingresa un usuario" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="txtPassword" placeholder="Ingresa una contraseña" required>
            </div>
            <button type="submit" class="btn">Entrar</button>
        </form>
        <div class="links-adicionales">
            <a href="#">¿Olvidaste tu contraseña?</a>
            <a href="#">¿Aún no tienes una cuenta?</a>
        </div>
    </div>

</body>
</html>
